<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7650"/>
      <stop offset="1" stop-color="#FF9A4A"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62537B"/>
      <stop offset="1" stop-color="#27355F"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFF4C7"/>
      <stop offset="1" stop-color="#FFE7A3"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background. Let iOS/watchOS/Android apply their own mask. -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Sunset -->
  <circle cx="512" cy="455" r="190" fill="url(#sun)"/>

  <!-- Water -->
  <rect y="650" width="1024" height="374" fill="url(#water)"/>

  <!-- Minimal sunset reflections -->
  <g fill="#FFB35D" opacity=".78">
    <ellipse cx="512" cy="715" rx="155" ry="13"/>
    <ellipse cx="512" cy="760" rx="105" ry="10"/>
    <ellipse cx="512" cy="801" rx="62" ry="8"/>
    <ellipse cx="512" cy="838" rx="30" ry="6"/>
  </g>

  <!-- Hammock: single strong silhouette -->
  <path d="M0 382 L82 449
           C210 548 350 610 512 610
           C674 610 814 548 942 449
           L1024 382
           L1024 414
           L948 476
           C821 582 680 650 512 650
           C344 650 203 582 76 476
           L0 414 Z"
        fill="#17203D"/>

  <!-- Clean hammock attachment points -->
  <circle cx="82" cy="449" r="18" fill="#17203D"/>
  <circle cx="942" cy="449" r="18" fill="#17203D"/>
</svg>
